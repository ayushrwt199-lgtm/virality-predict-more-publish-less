<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graph Relationship Visualization</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--bg:#fbfaff;--card:#fff;--ink:#1f2330;--mute:#7b8094;--edge:#c9ccd6;--hot:#e11d63;--line:#e6e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--card:#1d1f29;--ink:#e8e9f0;--mute:#8d92a6;--edge:#4a4e5f;--line:#2c2f3d}}
:root[data-theme="dark"]{--bg:#14151c;--card:#1d1f29;--ink:#e8e9f0;--mute:#8d92a6;--edge:#4a4e5f;--line:#2c2f3d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;position:relative}
#title{position:absolute;left:16px;top:14px;font-weight:600;font-size:14px;z-index:2}
#tools{position:absolute;right:16px;top:12px;z-index:2;display:flex;gap:8px;align-items:center}
button{font:inherit;font-size:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.switch input{appearance:none;width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;transition:.2s;margin:0}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:#6d28d9}.switch input:checked::after{left:18px}
svg{width:100%;height:100%;display:block;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
.node{cursor:pointer;stroke:var(--card);stroke-width:1.5}
.lbl{font-size:9px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:2.5px}
.elbl{font-size:6px;fill:var(--mute);text-anchor:middle;pointer-events:none;letter-spacing:.2px}
.link{fill:none;stroke:var(--edge);stroke-width:.8;opacity:.7;transition:stroke .25s,opacity .25s,stroke-width .25s}
.link.hot{stroke:var(--hot);stroke-width:1.8;opacity:1}
.dim{opacity:.12!important}
#legend{position:absolute;left:14px;bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:11px;max-width:min(430px,calc(100% - 28px));z-index:2}
#legend b{font-size:10px;letter-spacing:.8px;color:var(--hot)}
#legend div{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#panel{position:absolute;right:14px;top:56px;width:min(300px,calc(100% - 28px));max-height:calc(100% - 80px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:3;transform:translateX(20px);opacity:0;pointer-events:none;transition:.25s}
#panel.open{transform:none;opacity:1;pointer-events:auto}
#panel h4{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
#panel .tag{background:var(--hot);color:#fff;border-radius:99px;padding:2px 10px;font-size:11px}
#panel dt{color:var(--mute);margin-top:8px}#panel dd{margin:2px 0 0;word-break:break-word}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:4px 4px 0 0}
#x{border:0;background:none;font-size:16px;padding:0 4px}
</style>
</head>
<body>
<div id="title">Graph Relationship Visualization</div>
<div id="tools">
  <label class="switch">Show Edge Labels<input type="checkbox" id="edgeToggle" checked></label>
  <button id="refresh">↻ Refresh</button>
</div>
<svg id="svg"></svg>
<div id="legend"><b>ENTITY TYPES</b><div id="legendItems"></div></div>
<aside id="panel"></aside>

<script>
const TYPES={University:"#f97316",Entity:"#0f4c81",Alumni:"#7c3aed",Organization:"#16a34a",Student:"#be123c",Professor:"#ea580c",Person:"#38a3d8",
"Media Outlet":"#9333ea","Legal Authority":"#22a05a","Opinion Leader":"#f59e0b","Government Agency":"#f4623a"};
const NAMES="Wuhan University,Student,Gen Z,Zhihu,Douyin,Library,Parents,China,Weibo,Beijing,Counselor,Luojia,Xiaohong,Wikipedia,Hubei Law,WeChat,Alumni Group,Ministry,Taoshu,Peking Univ,Dean,Insight,Forum,Press,Think Tank,Court,Bureau,Union,Analyst,Reporter,Netizen,Scholar,Board,Campus,Hotline,Survey,Policy,Media Lab,Faculty,Club".split(",");
const RELS="RELATES_TO,CRITICISES,USES_PLATFORM,CAUSES,PROTECTS_AID,ACTIVELY_DISCUSSES_ON,INVOLVED_IN_CONFLICT,PARTICIPATED_IN,IS_AGENT_OF,CONTRIBUTES_TO,INFLUENCED_BY,EXPRESSES_CONCERN".split(",");
const LONG="facing brand reputation crisis; governance shortcomings and delayed communication; needs public credibility repair.";
const svg=d3.select("#svg"),g=svg.append("g"),panel=document.getElementById("panel");
let sim,linkSel,nodeSel,elSel,nlSel,data,selected=null;

document.getElementById("legendItems").innerHTML=Object.entries(TYPES).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join("");

const rnd=(a)=>a[Math.floor(Math.random()*a.length)];
function makeData(n=85){
  const keys=Object.keys(TYPES);
  const nodes=d3.range(n).map(i=>({id:i,name:i<NAMES.length?NAMES[i]:rnd(NAMES)+" "+i,type:i===0?"University":rnd(keys),
    uuid:crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)}));
  const links=[],hubs=[0,1,2,3,4];
  nodes.forEach(nd=>{ if(nd.id>4) links.push({source:nd.id,target:rnd(hubs),rel:rnd(RELS)});
    if(Math.random()<.5) links.push({source:nd.id,target:Math.floor(Math.random()*n),rel:rnd(RELS)}); });
  links.forEach(l=>{ if(l.source===l.target) l.target=(l.target+1)%n; });
  return {nodes,links:links.filter((l,i)=>l.source!==l.target)};
}

function build(){
  g.selectAll("*").remove(); if(sim) sim.stop(); closePanel();
  data=makeData();
  const W=innerWidth,H=innerHeight;
  const nbrs=new Map(data.nodes.map(n=>[n.id,new Set()]));
  data.links.forEach(l=>{nbrs.get(l.source).add(l.target);nbrs.get(l.target).add(l.source);});
  data.links.forEach((l,i)=>l.curve=((i%5)-2)*18+ (i%2?8:-8));
  linkSel=g.append("g").selectAll("path").data(data.links).join("path").attr("class","link");
  elSel=g.append("g").selectAll("text").data(data.links).join("text").attr("class","elbl").text(d=>d.rel);
  nodeSel=g.append("g").selectAll("circle").data(data.nodes).join("circle").attr("class","node")
    .attr("r",d=>d.id<5?9:5+Math.min(6,nbrs.get(d.id).size*.8)).attr("fill",d=>TYPES[d.type])
    .on("click",(e,d)=>{e.stopPropagation();select(d,nbrs)})
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=d.fy=null}));
  nlSel=g.append("g").selectAll("text").data(data.nodes).join("text").attr("class","lbl").attr("dx",9).attr("dy",3).text(d=>d.name);
  sim=d3.forceSimulation(data.nodes)
    .force("link",d3.forceLink(data.links).id(d=>d.id).distance(70).strength(.5))
    .force("charge",d3.forceManyBody().strength(-160))
    .force("center",d3.forceCenter(W/2,H/2))
    .force("collide",d3.forceCollide(14))
    .on("tick",()=>{
      linkSel.attr("d",d=>{const mx=(d.source.x+d.target.x)/2,my=(d.source.y+d.target.y)/2,dx=d.target.x-d.source.x,dy=d.target.y-d.source.y,len=Math.hypot(dx,dy)||1;
        d.cx=mx-dy/len*d.curve;d.cy=my+dx/len*d.curve;return `M${d.source.x},${d.source.y}Q${d.cx},${d.cy} ${d.target.x},${d.target.y}`});
      elSel.attr("x",d=>(d.source.x+2*d.cx+d.target.x)/4).attr("y",d=>(d.source.y+2*d.cy+d.target.y)/4);
      nodeSel.attr("cx",d=>d.x).attr("cy",d=>d.y);
      nlSel.attr("x",d=>d.x).attr("y",d=>d.y);
    });
  toggleLabels();
}

function select(d,nbrs){
  selected=d;
  linkSel.classed("hot",l=>l.source===d||l.target===d).classed("dim",l=>l.source!==d&&l.target!==d);
  elSel.classed("dim",l=>l.source!==d&&l.target!==d);
  nodeSel.classed("dim",n=>n!==d&&!nbrs.get(d.id).has(n.id));
  nlSel.classed("dim",n=>n!==d&&!nbrs.get(d.id).has(n.id));
  panel.innerHTML=`<h4>Node Details <span><span class="tag" style="background:${TYPES[d.type]}">${d.type}</span> <button id="x">✕</button></span></h4>
  <dl style="margin:0"><dt>Name:</dt><dd>${d.name}</dd><dt>UUID:</dt><dd style="color:var(--mute)">${d.uuid}</dd>
  <dt>Created:</dt><dd>${new Date().toLocaleString([], {dateStyle:"medium",timeStyle:"short"})}</dd>
  <dt>Properties:</dt><dd>org_name: ${d.name}<br>reputation_score: repair public credibility</dd>
  <dt>Summary:</dt><dd>${d.name} ${LONG}</dd>
  <dt>Labels:</dt><dd><span class="chip">Entity</span><span class="chip">${d.type}</span></dd></dl>`;
  panel.classList.add("open");
  document.getElementById("x").onclick=closePanel;
}
function closePanel(){
  panel.classList.remove("open"); selected=null;
  g.selectAll(".hot").classed("hot",false); g.selectAll(".dim").classed("dim",false);
}
function toggleLabels(){ elSel.style("display",document.getElementById("edgeToggle").checked?null:"none"); }

svg.call(d3.zoom().scaleExtent([.3,4]).on("zoom",e=>g.attr("transform",e.transform))).on("click",closePanel);
document.getElementById("edgeToggle").onchange=toggleLabels;
document.getElementById("refresh").onclick=build;
build();
</script>
</body>
</html>
